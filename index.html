<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD1DC">
    <meta name="description" content="Una sorpresa especial para Fati">
    
    <title>Para Fati ♡</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pétalos de fondo -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- Pantalla 1: Bienvenida -->
    <section id="welcomeScreen" class="screen active">
        <div class="content">
            <h1 class="greeting">Hola Fati…</h1>
            <button class="main-button pulse" id="startButton">
                Toca para ver algo especial 💕
            </button>
        </div>
    </section>

    <!-- Pantalla 2: Mensaje y Pregunta -->
    <section id="messageScreen" class="screen">
        <div class="content">
            <!-- Flores SVG decorativas -->
            <div class="flowers-container">
                <svg class="flower flower-1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g class="flower-group">
                        <!-- Tallo -->
                        <path d="M50 100 Q48 70 50 50" stroke="#A8D5BA" stroke-width="2" fill="none"/>
                        <!-- Hoja -->
                        <path d="M50 70 Q40 65 45 75 Q50 72 50 70" fill="#D4F4DD"/>
                        <!-- Pétalos -->
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFD1DC" transform="rotate(0 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFC4D9" transform="rotate(72 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFD1DC" transform="rotate(144 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFC4D9" transform="rotate(216 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFD1DC" transform="rotate(288 50 40)"/>
                        <!-- Centro -->
                        <circle cx="50" cy="40" r="4" fill="#FFE5D9"/>
                    </g>
                </svg>
                
                <svg class="flower flower-2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g class="flower-group">
                        <path d="M50 100 Q52 70 50 50" stroke="#A8D5BA" stroke-width="2" fill="none"/>
                        <path d="M50 75 Q60 70 55 80 Q50 77 50 75" fill="#D4F4DD"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#E0BBE4" transform="rotate(0 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#D7C0F0" transform="rotate(72 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#E0BBE4" transform="rotate(144 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#D7C0F0" transform="rotate(216 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#E0BBE4" transform="rotate(288 50 40)"/>
                        <circle cx="50" cy="40" r="4" fill="#FFE5D9"/>
                    </g>
                </svg>

                <svg class="flower flower-3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g class="flower-group">
                        <path d="M50 100 Q49 70 50 50" stroke="#A8D5BA" stroke-width="2" fill="none"/>
                        <path d="M50 68 Q42 63 46 73 Q50 70 50 68" fill="#D4F4DD"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#F8C4D5" transform="rotate(0 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFD1DC" transform="rotate(72 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#F8C4D5" transform="rotate(144 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#FFD1DC" transform="rotate(216 50 40)"/>
                        <ellipse cx="50" cy="40" rx="8" ry="12" fill="#F8C4D5" transform="rotate(288 50 40)"/>
                        <circle cx="50" cy="40" r="4" fill="#FFE5D9"/>
                    </g>
                </svg>
            </div>

            <div class="message-text">
                <p class="text-line line-1">Mi amor, Te amo luciernaga 💚✨</p>
                <p class="text-line line-2">Todos los días contigo son los mejores de mi vida.</p>
                <p class="text-line line-3">Me haces sonreír incluso cuando todo está mal.</p>
                <p class="text-line line-4">Eres mi paz, mi risa, mi todo.</p>
            </div>

            <div class="question-container">
                <h2 class="question heartbeat">¿Quieres ser mi San Valentín? 🌸</h2>
                
                <div class="buttons-container">
                    <button class="answer-button yes-button" id="yesButton">
                        SÍ, claro que sí!!! 💖
                    </button>
                    <button class="answer-button maybe-button" id="maybeButton">
                        Mmm… déjame pensarlo jeje
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Pantalla 3: Respuesta SÍ -->
    <section id="yesScreen" class="screen">
        <div class="content celebration">
            <div class="confetti" id="confetti"></div>
            <div class="big-heart">♡</div>
            <p class="celebration-text">Te amo muchísimo Amor ♡</p>
            <p class="celebration-subtitle">🥰</p>
            <button class="main-button" id="regresarButton">
                Regresar💕
            </button>
        </div>
    </section>

    <!-- Pantalla 4: Respuesta MAYBE -->
    <section id="maybeScreen" class="screen">
        <div class="content">
            <div class="flowers-small">🌷</div>
            <p class="maybe-text">Comooooo por????????</p>
            <button class="main-button" id="reconsiderButton">
                Broma jejejeje💕
            </button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
