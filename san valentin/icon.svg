<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular suave -->
  <circle cx="256" cy="256" r="256" fill="#FFF5F9"/>
  
  <!-- Tallo -->
  <path d="M256 450 Q250 320 256 250" stroke="#A8D5BA" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Hojas -->
  <path d="M256 350 Q200 320 220 370 Q256 345 256 350" fill="#D4F4DD" opacity="0.8"/>
  <path d="M256 320 Q312 290 292 340 Q256 315 256 320" fill="#D4F4DD" opacity="0.8"/>
  
  <!-- Pétalos de la flor (5 pétalos en círculo) -->
  <ellipse cx="256" cy="200" rx="50" ry="80" fill="#FFD1DC" transform="rotate(0 256 200)"/>
  <ellipse cx="256" cy="200" rx="50" ry="80" fill="#FFC4D9" transform="rotate(72 256 200)"/>
  <ellipse cx="256" cy="200" rx="50" ry="80" fill="#FFD1DC" transform="rotate(144 256 200)"/>
  <ellipse cx="256" cy="200" rx="50" ry="80" fill="#FFC4D9" transform="rotate(216 256 200)"/>
  <ellipse cx="256" cy="200" rx="50" ry="80" fill="#FFD1DC" transform="rotate(288 256 200)"/>
  
  <!-- Centro de la flor -->
  <circle cx="256" cy="200" r="30" fill="#FFE5D9"/>
  <circle cx="256" cy="200" r="20" fill="#F8C4D5"/>
  
  <!-- Pequeño corazón en el centro -->
  <path d="M256 190 C256 185 260 182 264 182 C268 182 272 185 272 190 C272 195 256 205 256 205 C256 205 240 195 240 190 C240 185 244 182 248 182 C252 182 256 185 256 190" fill="#FFFFFF" opacity="0.6"/>
